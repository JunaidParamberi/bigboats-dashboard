<title>Big Boats UAE — Chats</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --wa-green: #075E54;
    --wa-green-light: #128C7E;
    --wa-teal: #25D366;
    --wa-bg: #ECE5DD;
    --wa-sent: #DCF8C6;
    --wa-received: #FFFFFF;
    --wa-header: #075E54;
    --wa-list-bg: #FFFFFF;
    --wa-divider: #E0E0E0;
    --wa-text: #111B21;
    --wa-sub: #667781;
    --wa-time: #667781;
    --wa-unread: #25D366;
    --wa-input-bg: #FFFFFF;
    --wa-reply-bar: #F0F2F5;
    --wa-tick: #53BDEB;
    --wa-escalate: #FF3B30;
    --wa-human: #FF6B00;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #111B21;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--wa-list-bg);
    position: relative;
  }

  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--wa-list-bg);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    will-change: transform;
  }

  .view-list { transform: translateX(0); }
  .view-list.slide-out { transform: translateX(-100%); }
  .view-chat { transform: translateX(100%); background: var(--wa-bg); }
  .view-chat.slide-in { transform: translateX(0); }

  /* HEADER */
  .list-header {
    background: var(--wa-header);
    padding: 14px 16px 10px;
    padding-top: max(14px, env(safe-area-inset-top));
    flex-shrink: 0;
  }

  .list-header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .list-title { font-size: 20px; font-weight: 700; color: #FFFFFF; }

  .refresh-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .refresh-btn:active { background: rgba(255,255,255,0.2); }

  .search-bar {
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-input {
    background: none;
    border: none;
    outline: none;
    font-size: 14px;
    color: white;
    width: 100%;
    font-family: inherit;
  }

  .search-input::placeholder { color: rgba(255,255,255,0.5); }

  .tabs {
    background: var(--wa-header);
    display: flex;
    padding: 0 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
  }

  .tab {
    padding: 10px 0 10px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    margin-right: 20px;
  }

  .tab.active { color: white; border-bottom-color: white; }

  /* LIST */
  .list-scroll { flex: 1; overflow-y: auto; background: var(--wa-list-bg); }
  .list-scroll::-webkit-scrollbar { display: none; }

  /* Loading state */
  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 12px;
    color: var(--wa-sub);
    font-size: 14px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #E0E0E0;
    border-top-color: var(--wa-teal);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 8px;
    color: var(--wa-sub);
    font-size: 14px;
    text-align: center;
  }

  .empty-icon { font-size: 40px; margin-bottom: 4px; }

  .convo-item {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 12px 16px;
    border-bottom: 1px solid #F0F2F5;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    background: white;
  }

  .convo-item:active { background: #F5F5F5; }

  .wa-avatar {
    width: 49px;
    height: 49px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .convo-body { flex: 1; min-width: 0; }

  .convo-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }

  .convo-name {
    font-size: 15px;
    font-weight: 500;
    color: #111B21;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
  }

  .convo-time { font-size: 12px; color: var(--wa-sub); flex-shrink: 0; }
  .convo-time.unread { color: var(--wa-teal); }

  .convo-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .convo-preview {
    font-size: 13px;
    color: var(--wa-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .mode-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .mode-human { background: var(--wa-human); color: white; }
  .mode-ai { background: var(--wa-teal); color: white; }

  /* CHAT HEADER */
  .chat-header {
    background: var(--wa-header);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
    flex-shrink: 0;
  }

  .back-btn {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 4px 4px 4px 0;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }

  .chat-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .chat-info { flex: 1; min-width: 0; }

  .chat-name {
    font-size: 15px;
    font-weight: 600;
    color: white;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-status { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 1px; }

  .takeover-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 16px;
    padding: 5px 12px;
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }

  .takeover-btn:active { background: rgba(255,255,255,0.25); }
  .takeover-btn.human-mode { background: var(--wa-human); border-color: var(--wa-human); }

  /* MESSAGES */
  .chat-bg {
    flex: 1;
    overflow-y: auto;
    padding: 8px 6px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--wa-bg);
  }

  .chat-bg::-webkit-scrollbar { display: none; }

  .date-chip {
    text-align: center;
    margin: 8px auto;
    background: rgba(255,255,255,0.88);
    color: #667781;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 8px;
    display: inline-block;
    align-self: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }

  .msg-wrap { display: flex; flex-direction: column; margin-bottom: 1px; }
  .msg-wrap.sent { align-items: flex-end; padding-right: 6px; }
  .msg-wrap.received { align-items: flex-start; padding-left: 6px; }
  .msg-wrap.human-sent { align-items: flex-end; padding-right: 6px; }

  .msg-bubble {
    max-width: 78%;
    padding: 6px 9px 8px;
    border-radius: 7.5px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    box-shadow: 0 1px 1px rgba(0,0,0,0.12);
  }

  .msg-wrap.sent .msg-bubble {
    background: var(--wa-sent);
    color: #111B21;
    border-top-right-radius: 2px;
  }

  .msg-wrap.human-sent .msg-bubble {
    background: #FFE0B2;
    color: #111B21;
    border-top-right-radius: 2px;
  }

  .msg-wrap.received .msg-bubble {
    background: var(--wa-received);
    color: #111B21;
    border-top-left-radius: 2px;
  }

  .msg-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 3px;
    margin-top: 2px;
  }

  .msg-time-inner { font-size: 11px; color: #667781; }
  .tick { font-size: 12px; color: var(--wa-tick); }
  .human-label { font-size: 10px; color: var(--wa-human); font-weight: 600; }

  .system-msg {
    background: rgba(255,255,255,0.85);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    color: #667781;
    text-align: center;
    align-self: center;
    max-width: 85%;
    margin: 4px 0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  /* REPLY BAR */
  .reply-bar {
    background: var(--wa-reply-bar);
    padding: 8px 8px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }

  .reply-input-wrap {
    flex: 1;
    background: white;
    border-radius: 22px;
    display: flex;
    align-items: flex-end;
    padding: 8px 14px;
    gap: 10px;
  }

  .reply-textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-size: 15px;
    color: #111B21;
    resize: none;
    max-height: 100px;
    line-height: 1.4;
    font-family: inherit;
  }

  .reply-textarea::placeholder { color: #8696A0; }

  .wa-send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--wa-green-light);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
  }

  .wa-send-btn:active { background: var(--wa-green); }
  .wa-send-btn svg { width: 22px; height: 22px; fill: white; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1F2937;
    color: white;
    padding: 9px 18px;
    border-radius: 18px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.22s ease;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div class="app">
  <!-- LIST VIEW -->
  <div class="view view-list" id="listView">
    <div class="list-header">
      <div class="list-header-top">
        <span class="list-title">Big Boats UAE</span>
        <button class="refresh-btn" onclick="loadConversations()">↻ Refresh</button>
      </div>
      <div class="search-bar">
        <span style="color:rgba(255,255,255,0.6);font-size:14px">🔍</span>
        <input class="search-input" placeholder="Search" oninput="filterList(this.value)">
      </div>
    </div>
    <div class="tabs">
      <div class="tab active">All</div>
      <div class="tab" style="color:rgba(255,255,255,0.5)" onclick="filterByMode('human')">Takeover</div>
    </div>
    <div class="list-scroll" id="convo-list">
      <div class="loading-state"><div class="spinner"></div><span>Loading conversations...</span></div>
    </div>
  </div>

  <!-- CHAT VIEW -->
  <div class="view view-chat" id="chatView">
    <div class="chat-header">
      <button class="back-btn" onclick="goBack()">&#8592;</button>
      <div class="chat-avatar" id="chat-avatar"></div>
      <div class="chat-info">
        <div class="chat-name" id="chat-name"></div>
        <div class="chat-status" id="chat-status">Customer</div>
      </div>
      <button class="takeover-btn" id="takeover-btn" onclick="toggleMode()">Take Over</button>
    </div>
    <div class="chat-bg" id="chat-messages"></div>
    <div class="reply-bar">
      <div class="reply-input-wrap">
        <textarea class="reply-textarea" id="reply-input" placeholder="Type a reply..." rows="1"
          oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      </div>
      <button class="wa-send-btn" onclick="sendReply()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── WEBHOOK URLs ──
  const WEBHOOKS = {
    getConversations: 'https://hook.eu1.make.com/8ocj3cqmwseu7o45t2ujrfqh8a8bapxm',
    sendReply:        'https://hook.eu1.make.com/t8ttjua44rl8emisa0fslfmk41ljqa3y',
    takeOver:         'https://hook.eu1.make.com/8d9m3v5jrl9y23n6f5vrbstfi44kj9vo'
  };

  const AVATAR_COLORS = ['#1DA462','#3D7EFF','#FF6B35','#9C27B0','#E67E22','#D44638'];

  let allConversations = [];
  let currentConvo = null;
  let modes = {}; // phone → 'ai' | 'human'
  let refreshTimer = null;

  // ── LOAD CONVERSATIONS ──
  async function loadConversations() {
    document.getElementById('convo-list').innerHTML =
      '<div class="loading-state"><div class="spinner"></div><span>Loading...</span></div>';
    try {
      const res = await fetch(WEBHOOKS.getConversations, { method: 'POST', body: '{}' });
      const rows = await res.json();
      allConversations = groupByPhone(rows);
      renderList(allConversations);
    } catch (e) {
      document.getElementById('convo-list').innerHTML =
        '<div class="empty-state"><div class="empty-icon">⚠️</div><span>Could not load conversations.<br>Check your Make.com scenario is active.</span></div>';
    }
  }

  // ── GROUP ROWS BY PHONE ──
  function groupByPhone(rows) {
    const map = {};
    rows.forEach(r => {
      if (!r.phone) return;
      if (!map[r.phone]) map[r.phone] = { phone: r.phone, messages: [] };
      map[r.phone].messages.push(r);
    });
    return Object.values(map).map(c => {
      const last = c.messages[c.messages.length - 1];
      return {
        ...c,
        lastMsg: last?.message || '',
        lastSender: last?.sender || 'user',
        time: last?.time || '',
        color: AVATAR_COLORS[Math.abs(hashCode(c.phone)) % AVATAR_COLORS.length],
        initials: c.phone.slice(-2)
      };
    }).reverse(); // newest first
  }

  function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    return h;
  }

  // ── RENDER LIST ──
  function renderList(list) {
    const container = document.getElementById('convo-list');
    if (!list || list.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><span>No conversations yet.<br>Waiting for customers to message.</span></div>';
      return;
    }
    container.innerHTML = list.map(c => {
      const isHuman = modes[c.phone] === 'human';
      return `
        <div class="convo-item" onclick="openChat('${escHtml(c.phone)}')">
          <div class="wa-avatar" style="background:${c.color}">${c.initials}</div>
          <div class="convo-body">
            <div class="convo-top">
              <span class="convo-name">+${escHtml(c.phone)}</span>
              <span class="convo-time">${escHtml(formatTime(c.time))}</span>
            </div>
            <div class="convo-bottom">
              <div class="convo-preview">${escHtml(c.lastMsg.slice(0, 60))}</div>
              ${isHuman
                ? '<span class="mode-badge mode-human">YOU</span>'
                : '<span class="mode-badge mode-ai">AI</span>'}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function filterList(q) {
    const f = allConversations.filter(c =>
      c.phone.includes(q) || c.lastMsg.toLowerCase().includes(q.toLowerCase()));
    renderList(f);
  }

  function filterByMode(mode) {
    renderList(allConversations.filter(c => modes[c.phone] === mode));
  }

  // ── OPEN CHAT ──
  function openChat(phone) {
    currentConvo = allConversations.find(c => c.phone === phone);
    if (!currentConvo) return;

    document.getElementById('chat-name').textContent = '+' + phone;
    const avatar = document.getElementById('chat-avatar');
    avatar.textContent = phone.slice(-2);
    avatar.style.background = currentConvo.color;

    updateTakeoverBtn();
    renderMessages();

    document.getElementById('chatView').classList.add('slide-in');
    document.getElementById('listView').classList.add('slide-out');

    setTimeout(() => {
      const msgs = document.getElementById('chat-messages');
      msgs.scrollTop = msgs.scrollHeight;
      document.getElementById('reply-input').focus();
    }, 50);
  }

  function renderMessages() {
    const container = document.getElementById('chat-messages');
    const isHuman = modes[currentConvo.phone] === 'human';
    const status = isHuman ? '🟠 You are handling this chat' : '🤖 Sara is replying automatically';
    document.getElementById('chat-status').textContent = status;

    container.innerHTML = `<div class="date-chip">Conversation history</div>` +
      currentConvo.messages.map(m => {
        const role = m.sender === 'user' ? 'received'
                   : m.sender === 'human' ? 'human-sent'
                   : 'sent';
        const label = m.sender === 'human' ? '<span class="human-label">You</span>' : '';
        const tick = (role === 'sent' || role === 'human-sent') ? '<span class="tick">✓✓</span>' : '';
        return `
          <div class="msg-wrap ${role}">
            <div class="msg-bubble">
              ${escHtml(m.message)}
              <div class="msg-footer">
                ${label}
                <span class="msg-time-inner">${escHtml(formatTime(m.time))}</span>
                ${tick}
              </div>
            </div>
          </div>`;
      }).join('');
  }

  // ── TAKE OVER ──
  function updateTakeoverBtn() {
    const btn = document.getElementById('takeover-btn');
    const isHuman = modes[currentConvo?.phone] === 'human';
    btn.textContent = isHuman ? '↩ Return to AI' : 'Take Over';
    btn.classList.toggle('human-mode', isHuman);
  }

  async function toggleMode() {
    if (!currentConvo) return;
    const isHuman = modes[currentConvo.phone] === 'human';
    const newMode = isHuman ? 'ai' : 'human';
    modes[currentConvo.phone] = newMode;
    updateTakeoverBtn();
    renderMessages();
    renderList(allConversations);
    try {
      await fetch(WEBHOOKS.takeOver, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ phone: currentConvo.phone, mode: newMode })
      });
      showToast(newMode === 'human' ? '🟠 You took over this chat' : '🤖 Sara is back on this chat');
    } catch(e) {
      showToast('⚠️ Mode change failed — check Make.com');
    }
  }

  // ── SEND REPLY ──
  async function sendReply() {
    const input = document.getElementById('reply-input');
    const text = input.value.trim();
    if (!text || !currentConvo) return;

    input.value = '';
    input.style.height = 'auto';

    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

    // Add to local messages immediately
    currentConvo.messages.push({ phone: currentConvo.phone, sender: 'human', message: text, time: timeStr });
    currentConvo.lastMsg = text;
    currentConvo.lastSender = 'human';
    renderMessages();
    renderList(allConversations);

    const msgs = document.getElementById('chat-messages');
    msgs.scrollTop = msgs.scrollHeight;

    try {
      await fetch(WEBHOOKS.sendReply, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ to: currentConvo.phone, message: text })
      });
      showToast('✓ Sent via WhatsApp');
    } catch(e) {
      showToast('⚠️ Send failed — check Make.com');
    }
  }

  function goBack() {
    document.getElementById('chatView').classList.remove('slide-in');
    document.getElementById('listView').classList.remove('slide-out');
    document.getElementById('reply-input').value = '';
    currentConvo = null;
    startAutoRefresh();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  // ── AUTO REFRESH ──
  function startAutoRefresh() {
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      if (!currentConvo) loadConversations();
    }, 30000);
  }

  // ── HELPERS ──
  function formatTime(t) {
    if (!t) return '';
    // If already HH:MM format, return as is
    if (/^\d{2}:\d{2}$/.test(t)) return t;
    // Try parsing as timestamp
    try {
      const d = new Date(parseInt(t) * 1000);
      if (!isNaN(d)) return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
    } catch(e) {}
    return t.slice(0, 5);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── INIT ──
  loadConversations();
  startAutoRefresh();
</script>
